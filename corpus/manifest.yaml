# Manifiesto del corpus de KARE-E.
#
# Cada fuente declara de dónde viene y bajo qué condiciones se usa.
# `kare ingerir` solo indexa fuentes con license_status "abierta" o
# "uso_interno"; las demás quedan listadas pero fuera del índice. Si una
# fuente baja de categoría, la siguiente ingesta completa la retira.
#
# Los archivos van en corpus/fuentes/ y no se versionan (ver .gitignore).
# Formatos: .pdf, .txt, .md. Un PDF escaneado necesita OCR antes.
#
# download_url + sha256: `kare descargar` baja el archivo de su fuente oficial
# y lo acepta solo si su huella coincide con la versión revisada. Si la fuente
# publica otra versión, no se indexa hasta revisarla y actualizar sha256
# (`sha256sum archivo.pdf` en Linux, `shasum -a 256 archivo.pdf` en macOS).
#
# license_status:
#   abierta        licencia abierta verificada (CC, dominio público, norma pública)
#   uso_interno    términos leídos que permiten indexarla para uso interno, sin redistribuir
#   por_verificar  no se indexa hasta leer los términos de uso
#   restringida    no se indexa: requiere permiso escrito o licencia
#
# kind: guia | norma | consenso | revision | protocolo
# reviewed_on: fecha (AAAA-MM-DD) en que alguien leyó los términos de uso.
# Semana 1 del sprint: verificar cada "por_verificar" y llenar reviewed_on.

sources:
  - id: oms-dolor-cancer-2018
    title: "WHO guidelines for the pharmacological and radiotherapeutic management of cancer pain in adults and adolescents"
    publisher: Organización Mundial de la Salud
    year: 2018
    jurisdiction: internacional
    kind: guia
    language: en
    file: oms_dolor_cancer_2018.pdf
    url: https://www.who.int/publications/i/item/9789241550390
    download_url: https://iris.who.int/server/api/core/bitstreams/809a021b-e75c-4f9c-b002-6fb13bf1a0f5/content
    sha256: c3a0bb5d44ef294cea399864d2438dadb852970797cea1eb30dbc73e227207dc
    license_status: abierta
    license_note: "CC BY-NC-SA 3.0 IGO, según la página de la OMS: uso no comercial con atribución; las adaptaciones llevan la misma licencia. ISBN 978 92 4 155039 0."
    reviewed_on: 2026-10-14

  - id: minsalud-gpc58-paliativos-2016
    title: "Guía de Práctica Clínica para la atención de pacientes en cuidado paliativo (adopción), GPC No. 58"
    publisher: Ministerio de Salud y Protección Social, IETS
    year: 2016
    version: "Versión final, guía completa (GPC 2016-58)"
    jurisdiction: Colombia
    kind: guia
    language: es
    file: minsalud_gpc58_paliativos_2016.pdf
    url: https://www.coosalud.com/wp-content/uploads/2019/03/Guias_practica_clinica/Version_cortapaliativo2016_04_20.pdf
    download_url: https://www.coosalud.com/wp-content/uploads/2019/03/Guias_practica_clinica/Version_cortapaliativo2016_04_20.pdf
    sha256: 2eebdb0ce56c7e10a938f1244ae5f23988b5ef62361b575548c549b47718fb3a
    license_status: uso_interno
    license_note: "Sin licencia abierta. Los derechos patrimoniales son del Ministerio (contrato 0142 de 2016); Osteba y la Junta de Andalucía autorizaron al IETS a adaptar sus recomendaciones. Uso interno de investigación: se indexa en equipos propios o en el servidor privado del bot (acceso restringido) y se citan fragmentos breves con la fuente; el PDF no se redistribuye. Pese al nombre del archivo, la copia de Coosalud es la versión final completa; si aparece en el repositorio del Ministerio, cambiar el enlace. Si KARE se vuelve producto, pedir permiso."
    reviewed_on: 2026-10-14

  - id: minsalud-gpc65-opioides-2022
    title: "Guía de práctica clínica para el tratamiento con opioides del dolor crónico no oncológico en población adulta y pediátrica en Colombia, GPC No. 65"
    publisher: Ministerio de Salud y Protección Social, IETS, Fondo Nacional de Estupefacientes
    year: 2022
    jurisdiction: Colombia
    kind: guia
    language: es
    file: minsalud_gpc65_opioides_2022.pdf
    url: https://consultorsalud.com/wp-content/uploads/2022/08/GPC-DCNO-Version-profesionales-de-la-salud-2022-08-23.pdf
    license_status: por_verificar
    license_note: "La licencia no es el problema: derechos cedidos al Ministerio, como la GPC 58. El problema es la versión: el PDF del Ministerio es la versión para pacientes y cuidadores, y la versión para profesionales que circula (copia de Consultorsalud, 23 ago 2022) dice revisión por pares «Pendiente». Se indexa cuando aparezca la versión final para profesionales. Solo para seguridad en el uso de opioides: no es una guía oncológica."
    reviewed_on: 2026-10-14

  - id: ley-1733-2014
